openapi: 3.0.1
info:
  description: "# This API provide access to FACEIT's data"
  license:
    name: Property of FACEIT LTD
  title: Data API
  version: "4"
servers:
- url: https://open.faceit.com/data/v4
security:
- key: []
paths:
  /championships:
    get:
      description: Retrieve all championships of a game
      operationId: getChampionships
      parameters:
      - description: The id of the game
        in: query
        name: game
        required: true
        schema:
          type: string
      - description: "Kind of matches to return. Can be all(default), upcoming, ongoing\
          \ or past"
        in: query
        name: type
        schema:
          enum:
          - all
          - upcoming
          - ongoing
          - past
          type: string
      - description: The starting item position
        in: query
        name: offset
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: The number of items to return
        in: query
        name: limit
        schema:
          default: 10
          maximum: 10
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChampionshipsList"
          description: Championships list
        "400":
          content: {}
          description: Bad request
        "401":
          content: {}
          description: Unauthorized
        "403":
          content: {}
          description: Forbidden
        "404":
          content: {}
          description: Not Found
        "429":
          content: {}
          description: Too many requests
        "503":
          content: {}
          description: Temporarily unavailable
        default:
          content: {}
          description: Generic error
      summary: Retrieve all championships of a game
      tags:
      - Championships
  /championships/{championship_id}:
    get:
      description: Retrieve championship details
      operationId: getChampionship
      parameters:
      - description: The id of the championship
        in: path
        name: championship_id
        required: true
        schema:
          type: string
      - description: List of entity names to expand in request
        explode: false
        in: query
        name: expanded
        schema:
          items:
            enum:
            - organizer
            - game
            type: string
          type: array
          uniqueItems: true
        style: form
      responses:
        "200":
          content:
            application/json:
